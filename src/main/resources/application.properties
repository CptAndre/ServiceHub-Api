# Carregado pelo Spring Boot por convenção/perfil, sem referências Java diretas.
# suppress inspection "UnusedProperty" for whole file
spring.application.name=servicehub-api
server.port=${SERVER_PORT:${PORT:8080}}
server.servlet.context-path=/
logging.level.com.example.servicehub_api=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n
spring.jpa.show-sql=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/servicehub}
spring.datasource.username=${DB_USER:${DB_USERNAME:postgres}}
spring.datasource.password=${DB_PASS:${DB_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.tags-sorter=alpha
spring.graphql.graphiql.enabled=true

# API security and HTTP hardening
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}}
app.max-payload-size-bytes=${MAX_PAYLOAD_SIZE_BYTES:1048576}
server.tomcat.max-http-form-post-size=${MAX_REQUEST_SIZE:1MB}
server.tomcat.max-swallow-size=${MAX_REQUEST_SIZE:1MB}
server.tomcat.allowed-trace-methods=
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:1MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:1MB}
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
spring.data.web.pageable.max-page-size=50
logging.level.org.springframework.security=INFO

# Chave de demonstração local. Substitua JWT_SECRET por uma chave Base64 de
# pelo menos 256 bits em qualquer ambiente compartilhado ou de produção.
jwt.secret=${JWT_SECRET:U2VydmljZUh1Yl9kZXZfb25seV9rZXlfMzJfYnl0ZXNfbWluaW11bQ==}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


# Bootstrap opcional, sem credenciais de demonstração.
app.bootstrap-admin.email=${SERVICEHUB_ADMIN_EMAIL:}
app.bootstrap-admin.password=${SERVICEHUB_ADMIN_PASSWORD:}
spring.jpa.open-in-view=false

# O Maven injeta a mesma versão no contrato e no artefato.
app.version=@project.version@
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=${app.version}
app.api.legacy.deprecation-date=${LEGACY_API_DEPRECATION_DATE:2026-11-07T00:00:00Z}
app.api.legacy.sunset-date=${LEGACY_API_SUNSET_DATE:}

#---
spring.config.activate.on-profile=!prod
spring.config.import=optional:file:.env[.properties]
