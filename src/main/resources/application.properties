spring.application.name=servicehub-api
server.port=8080
server.servlet.context-path=/
logging.level.com.example.servicehub_api=INFO
spring.jpa.show-sql=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/servicehub}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.tags-sorter=alpha

# API security and HTTP hardening
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
app.max-payload-size-bytes=${MAX_PAYLOAD_SIZE_BYTES:1048576}
server.tomcat.max-http-form-post-size=${MAX_REQUEST_SIZE:1MB}
server.tomcat.max-swallow-size=${MAX_REQUEST_SIZE:1MB}
server.tomcat.allowed-trace-methods=
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:1MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:1MB}
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
spring.data.web.pageable.max-page-size=50
logging.level.org.springframework.security=INFO

spring.config.import=optional:file:.env[.properties]
