# Carregado pelo Spring Boot por convenção/perfil, sem referências Java diretas.
# suppress inspection "UnusedProperty" for whole file
# Somente variáveis do ambiente de produção. O .env local não participa do deploy.
spring.config.import=
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER:${DB_USERNAME:}}
spring.datasource.password=${DB_PASS:${DB_PASSWORD:}}
jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${APP_CORS_ALLOWED_ORIGINS:}}
logging.structured.format.console=ecs
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
# Mensagens JDBC podem conter valores pessoais de restrições violadas.
# O handler registra o tipo da falha e o requestId, sem a mensagem bruta.
logging.level.org.hibernate.orm.jdbc.error=OFF
logging.level.org.hibernate.orm.jdbc.warn=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
spring.graphql.graphiql.enabled=false
server.forward-headers-strategy=framework
